# Crafts. Reagent/output quantities are per craft. Reagents marked `vendor: true` are
# priced at the vendor's buy price; everything else at the AH market price (buying it,
# or the opportunity cost of not selling what you gathered yourself).
# Forever added 600+ new recipes; these are the vanilla staples until we map new ones (TODO).

