# Gathering routes. Yields are items per hour for a focused route with a normal mount,
# estimated from Classic Era experience (confidence: estimate). Forever adds "Scarce"
# materials to every node type; their item IDs are not known yet (TODO).
# class_modifiers multiply yields: druids skip dismounting (travel/flight form), etc.

# ---------------------------------------------------------------- herbalism

- id: herb_barrens_low
  name: Low-level herbs (Barrens / Silverpine)
  kind: gather
  zone: The Barrens
  zones: ["The Barrens", "Silverpine Forest", "Darkshore", "Westfall"]
  requirements: {level: 15, professions: {herbalism: 100}}
  yields:
