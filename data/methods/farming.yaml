# Mob farming. Yields per hour for a solo player in appropriate gear.
# vendor_copper_per_hour = coins + grey items sold to a vendor.
# Forever nerfed mage AoE (Cone of Cold, Arcane Concentration, Improved Blizzard), so mage
# AoE dungeon farms are left out and mages get no special bonus here.

- id: farm_silk_arathi
  name: Silk cloth (Arathi Highlands humanoids)
  kind: farm
  zone: Arathi Highlands
  requirements: {level: 32}
  yields:
    - {item: 4306, name: Silk Cloth, qty: 60, sd: 20}
  vendor_copper_per_hour: 25000
  class_modifiers: &solo_farm {hunter: 1.15, warlock: 1.1, mage: 1.05, paladin: 0.9, priest: 0.85}

